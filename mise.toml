# Developer toolchain via mise (https://mise.jdx.dev). `mise install` provisions
# the exact tools. Everything is Go: the linters are built from source with the
# pinned toolchain, and redcheck and mutate are the storage core's tools, run
# through Go's `tool` directive (go.mod).
[tools]
go = "1.27"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.13.2"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"

[env]
CGO_ENABLED = "0"

[tasks.ci]
description = "Local run-all: the storage core's tools/ci, told the engine's layout (what CI runs)"
run = 'go tool ci -product merge/,model/,engine/ -adapters='

[tasks."ci:quick"]
description = "The fast subset of CI: fmt, vet, lint, race suite"
run = 'go tool ci -product merge/,model/,engine/ -adapters= -quick'

[tasks.test]
description = "Unit, contract, property and golden suites"
run = "go test -count=1 ./..."

[tasks.race]
description = "The whole suite under the race detector (what CI's test job runs)"
run = "CGO_ENABLED=1 go test -race -count=1 ./..."

[tasks.lint]
description = "golangci-lint with warnings as errors (depguard, forbidigo, staticcheck, ...)"
run = "golangci-lint run ./..."

[tasks.vuln]
description = "govulncheck over the module, the core included"
run = "govulncheck ./..."

[tasks.cover]
description = "Statement coverage per package; every package of ours must reach 90%"
run = 'go tool ci -product merge/,model/,engine/ -adapters= -only cover'

[tasks.redcheck]
description = "Every `test:` commit on this branch fails (on an assertion) without its `feat:`/`fix:` (the core's tool)"
run = "go tool redcheck"

[tasks.mutate]
description = "Re-run the checked-in mutants (tools/mutate/mutants.txt) in throwaway copies; every one must be killed (the core's tool)"
run = "go tool mutate"

[tasks.fuzz]
description = "Every fuzz target for FUZZTIME each (default 30s; the weekly run uses 10m)"
run = 'go tool ci -product merge/,model/,engine/ -adapters= -only fuzz'
