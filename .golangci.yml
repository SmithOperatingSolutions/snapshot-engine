version: "2"

run:
  timeout: 10m

linters:
  default: standard
  enable:
    - depguard       # the layer table (docs/DESIGN.md §2) and the pinned core
    - forbidigo      # no ad-hoc output or panics-as-control-flow
    - gochecknoinits # "no init() side effects"
    - gosec
    - errorlint
    - bodyclose
    - copyloopvar
    - misspell
    - nolintlint
    - unconvert
    - gocritic
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    gosec:
      excludes:
        # Integer-conversion findings flood hand-written binary codecs; bounds
        # are checked explicitly before every conversion and every decoder is
        # fuzzed, which is the real guard.
        - G115
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print.*|print|println)$
          msg: "the engine does not write to stdout; return errors or use a passed-in logger"
    depguard:
      rules:
        no-reflective-decoding:
          files: ["$all", "!$test"]
          deny:
            - pkg: reflect
              desc: "no reflection on stored bytes; write a bounds-checked decoder"
            - pkg: encoding/json
              desc: "no generic deserialization of stored bytes; a model that reads JSON has its own bounded parser"
            - pkg: encoding/gob
              desc: "no generic deserialization of stored bytes"
            - pkg: unsafe
              desc: "no unsafe"
            - pkg: os/exec
              desc: "no os/exec in production code"
        merge-depends-on-nothing:
          files: ["**/merge/**"]
          deny:
            - pkg: github.com/SmithOperatingSolutions/snapshot-core
              desc: "the merge library is pure values; it knows nothing of the core (DESIGN D5)"
            - pkg: github.com/SmithOperatingSolutions/snapshot-engine
              desc: "no upward imports: merge is the bottom layer"
        models-are-plugins:
          files: ["**/model/**"]
          deny:
            - pkg: github.com/SmithOperatingSolutions/snapshot-engine/engine
              desc: "no upward imports: a model never sees the API over it"
            - pkg: github.com/SmithOperatingSolutions/snapshot-core/core/blob
              desc: "a model reads and writes chunks through the port it is handed, never a backend"
            - pkg: github.com/SmithOperatingSolutions/snapshot-core/core/chunk/packstore
              desc: "a model never touches a chunk store implementation"
            - pkg: github.com/SmithOperatingSolutions/snapshot-core/core/vcs
              desc: "models know nothing of history"
            - pkg: github.com/SmithOperatingSolutions/snapshot-core/core/gc
              desc: "models know nothing of GC"
            - pkg: github.com/SmithOperatingSolutions/snapshot-core/core/repo
              desc: "models know nothing of the repository"
            - pkg: github.com/SmithOperatingSolutions/snapshot-core/core/object
              desc: "a model is one object; namespaces are above it"
        the-core-is-pinned:
          files: ["$all"]
          deny:
            - pkg: github.com/SmithOperatingSolutions/snapshot-core/core/dnx
              desc: "disknexus is the core's business; nothing here reaches past the core's ports"
            - pkg: github.com/SmithOperatingSolutions/snapshot-core/core/internal
              desc: "internal to the core"
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go$
        linters: [gosec, forbidigo]

formatters:
  enable:
    - gofmt
