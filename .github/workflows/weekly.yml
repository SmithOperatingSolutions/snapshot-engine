# The slow tiers, once a week (Sunday morning UTC) and on demand: every
# checked-in mutant re-run to prove the guards still have teeth, and every
# fuzz target for ten minutes. Weekly, not nightly, as in the storage core.
name: Weekly

on:
  schedule:
    - cron: "17 7 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go tool mutate

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go tool ci -product merge/,model/,engine/ -adapters= -only fuzz -fuzztime 10m
      - if: failure() # a finding's input, to minimize and check in (CONTRIBUTING)
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
